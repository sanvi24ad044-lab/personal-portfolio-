<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Contact Sanvi Shettigar for portfolio and project inquiries.">

    <meta name="author"
          content="Sanvi Shettigar">

    <meta name="robots"
          content="index, follow">

    <title>
        Contact | Sanvi Shettigar
    </title>

    <link rel="stylesheet"
          href="css/style.css">

</head>


<body>

    <!-- Skip Link -->
    <a class="skip-link"
       href="#main-content">

        Skip to main content

    </a>


    <!-- Header -->
    <header class="site-header">

        <div class="container header-inner">

            <a class="logo"
               href="index.html"
               aria-label="Sanvi Shettigar Home">

                Sanvi Shettigar

            </a>


            <!-- Navigation -->
            <nav aria-label="Primary navigation">

                <ul class="nav-list">

                    <li>
                        <a href="index.html">
                            Home
                        </a>
                    </li>

                    <li>
                        <a href="about.html">
                            About
                        </a>
                    </li>

                    <li>
                        <a href="projects.html">
                            Projects
                        </a>
                    </li>

                    <li>
                        <a href="contact.html"
                           aria-current="page">

                            Contact

                        </a>
                    </li>

                </ul>

            </nav>

        </div>

    </header>


    <!-- Main -->
    <main id="main-content">


        <!-- Page Heading -->
        <section class="page-heading"
                 aria-labelledby="page-title">

            <div class="container">

                <p class="eyebrow">
                    Let's connect
                </p>

                <h1 id="page-title">
                    Contact Me
                </h1>

            </div>

        </section>


        <!-- Contact Form -->
        <section class="section"
                 aria-labelledby="contact-title">

            <div class="container content-narrow">

                <h2 id="contact-title">
                    Send a Message
                </h2>

                <p id="form-help">
                    All fields marked with an asterisk are required.
                </p>


                <form
                    action="https://formsubmit.co/YOUR_EMAIL@example.com"
                    method="POST"
                    aria-describedby="form-help">


                    <!-- Form Settings -->
                    <input type="hidden"
                           name="_subject"
                           value="New Portfolio Contact Message">

                    <input type="hidden"
                           name="_captcha"
                           value="true">

                    <input type="hidden"
                           name="_template"
                           value="table">


                    <!-- Name -->
                    <div class="form-group">

                        <label for="name">

                            Full Name

                            <span aria-hidden="true">
                                *
                            </span>

                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            autocomplete="name"
                            required
                            aria-required="true"
                            aria-describedby="name-help">

                        <p class="field-help"
                           id="name-help">

                            Please enter your full name.

                        </p>

                    </div>


                    <!-- Email -->
                    <div class="form-group">

                        <label for="email">

                            Email Address

                            <span aria-hidden="true">
                                *
                            </span>

                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            autocomplete="email"
                            inputmode="email"
                            required
                            aria-required="true"
                            aria-describedby="email-help">

                        <p class="field-help"
                           id="email-help">

                            Enter a valid email address.

                        </p>

                    </div>


                    <!-- Subject -->
                    <div class="form-group">

                        <label for="subject">

                            Subject

                            <span aria-hidden="true">
                                *
                            </span>

                        </label>

                        <input
                            type="text"
                            id="subject"
                            name="subject"
                            required
                            aria-required="true">

                    </div>


                    <!-- Message -->
                    <div class="form-group">

                        <label for="message">

                            Message

                            <span aria-hidden="true">
                                *
                            </span>

                        </label>

                        <textarea
                            id="message"
                            name="message"
                            rows="7"
                            required
                            aria-required="true"
                            aria-describedby="message-help"></textarea>

                        <p class="field-help"
                           id="message-help">

                            Tell me how I can help.

                        </p>

                    </div>


                    <!-- Submit -->
                    <button
                        class="button"
                        type="submit">

                        Send Message

                    </button>

                </form>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer class="site-footer">

        <div class="container">

            <p>
                &copy; <span id="year">2026</span>
                Sanvi Shettigar.
            </p>

        </div>

    </footer>


    <script>
        document.getElementById("year").textContent =
            new Date().getFullYear();
    </script>

</body>

</html>
